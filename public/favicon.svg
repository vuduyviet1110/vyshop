    <path fill="#DFBE84" d="M 23.5 6 H 32 C 45 6, 56 16, 47 34 C 40 48, 25 56, 25 56 C 25 56, 39 42, 40 31 C 41.5 19, 32 13, 23.5 13 Z" />
