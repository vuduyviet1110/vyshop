<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Nền xanh sage mờ tối đặc trưng -->
  <rect width="100" height="100" rx="20" fill="#435546"/>
  
  <g transform="translate(18, 14)">
    <!-- Biểu tượng chữ V uốn lụa cách điệu chính xác theo ảnh mẫu -->
